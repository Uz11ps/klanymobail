server {
  listen 80;
  listen 443 ssl;
  server_name _;

  client_max_body_size 25m;

  # Self-signed cert is mounted from host (see docker-compose nginx volumes).
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # Flutter Web admin build is mounted to /usr/share/nginx/html
  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api/ {
    # Pass URI as-is: /api/* -> http://api:3000/api/*
    proxy_pass http://klany-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /webhooks/yookassa {
    # Support legacy path without /api prefix (backend uses /api/webhooks/yookassa)
    proxy_pass http://klany-api:3000/api/webhooks/yookassa;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /webhooks/telegram {
    # Support legacy path without /api prefix (backend uses /api/webhooks/telegram)
    proxy_pass http://klany-api:3000/api/webhooks/telegram;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Mobile PWA served at /app
  location ^~ /app {
    alias /usr/share/nginx/app;
    index index.html;
    try_files $uri $uri/ /app/index.html;
  }

  location / {
    # SPA fallback for Flutter web routing (admin panel)
    try_files $uri $uri/ /index.html;
  }
}


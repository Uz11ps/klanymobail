server {
  listen 80;
  listen 443 ssl;
  server_name _;

  client_max_body_size 25m;

  # Self-signed cert is mounted from host (see docker-compose nginx volumes).
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # Flutter Web admin build is mounted to /usr/share/nginx/html
  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api/ {
    # Pass URI as-is: /api/* -> http://api:3000/api/*
    proxy_pass http://klany-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /webhooks/yookassa {
    # Support legacy path without /api prefix (backend uses /api/webhooks/yookassa)
    proxy_pass http://klany-api:3000/api/webhooks/yookassa;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /webhooks/telegram {
    # Support legacy path without /api prefix (backend uses /api/webhooks/telegram)
    proxy_pass http://klany-api:3000/api/webhooks/telegram;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public S3-compatible bucket paths for presigned uploads/downloads.
  # The API signs URLs with MINIO_PUBLIC_BASE_URL, so the browser must call
  # the same public host while nginx forwards the original bucket path to MinIO.
  location ~ ^/(quest-evidence|shop-products|member-avatars)(/.*)?$ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "$http_origin" always;
      add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Amz-Date, X-Amz-Content-Sha256, X-Amz-Security-Token" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      return 204;
    }

    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Type" always;

    proxy_pass http://klany-minio:9000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Mobile PWA served at /app
  location ^~ /app {
    alias /usr/share/nginx/app;
    index index.html;
    try_files $uri $uri/ /app/index.html;
  }

  location / {
    # SPA fallback for Flutter web routing (admin panel)
    try_files $uri $uri/ /index.html;
  }
}


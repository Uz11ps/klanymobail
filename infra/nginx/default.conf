server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  # Flutter Web admin build is mounted to /usr/share/nginx/html
  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api/ {
    # Pass URI as-is: /api/* -> http://api:3000/api/*
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /webhooks/yookassa {
    # Support legacy path without /api prefix (backend uses /api/webhooks/yookassa)
    proxy_pass http://api:3000/api/webhooks/yookassa;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /webhooks/telegram {
    # Support legacy path without /api prefix (backend uses /api/webhooks/telegram)
    proxy_pass http://api:3000/api/webhooks/telegram;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public S3-compatible bucket paths for presigned uploads/downloads.
  # Flutter Web / localhost → presigned PUT must pass OPTIONS preflight with CORS.
  # Named location via error_page avoids fragile "if" + add_header quirks.
  location ~ ^/(quest-evidence|shop-products|member-avatars)(/.*)?$ {
    error_page 418 = @storage_cors_preflight;
    if ($request_method = OPTIONS) {
      return 418;
    }

    # Strip upstream CORS so only nginx-defined headers apply (MinIO often sends none/wrong).
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, PUT, HEAD, POST, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers $storage_cors_allow_headers always;
    add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Type, x-amz-request-id, x-amz-version-id, Content-Range, Accept-Ranges" always;

    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @storage_cors_preflight {
    internal;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, PUT, HEAD, POST, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers $storage_cors_allow_headers always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Content-Length 0 always;
    add_header Content-Type "text/plain; charset=utf-8" always;
    return 204;
  }

  # Mobile PWA served at /app
  location ^~ /app {
    alias /usr/share/nginx/app;
    index index.html;
    try_files $uri $uri/ /app/index.html;
  }

  location / {
    # SPA fallback for Flutter web routing (admin panel)
    try_files $uri $uri/ /index.html;
  }
}

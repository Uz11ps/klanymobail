# Optional: proxy Apache :80 -> Docker nginx :8782 (when Apache already owns port 80).
# Install on Ubuntu:
#   cp scripts/server/apache_klany_proxy.conf /etc/apache2/sites-available/klany.conf
#   a2enmod proxy proxy_http headers
#   a2ensite klany.conf
#   a2dissite 000-default.conf   # if default site conflicts
#   systemctl reload apache2
#
# Then set in .env: HTTP_PORT=8782 and APP_PUBLIC_BASE_URL=http://31.31.201.32 (no port)

<VirtualHost *:80>
    ServerName 31.31.201.32

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    ProxyPass / http://127.0.0.1:8782/
    ProxyPassReverse / http://127.0.0.1:8782/

    ErrorLog ${APACHE_LOG_DIR}/klany_error.log
    CustomLog ${APACHE_LOG_DIR}/klany_access.log combined
</VirtualHost>

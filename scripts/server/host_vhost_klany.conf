server {
    listen 192.168.0.191:80 default_server;
    server_name klanymobail.ru www.klanymobail.ru 91.197.99.149 91-197-99-149.regru.cloud www.91-197-99-149.regru.cloud _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    if ($host = klanymobail.ru) {
        return 301 https://$host$request_uri;
    }

    if ($host = www.klanymobail.ru) {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8782;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 192.168.0.191:443 ssl default_server;
    server_name klanymobail.ru www.klanymobail.ru 91.197.99.149 91-197-99-149.regru.cloud www.91-197-99-149.regru.cloud _;

    ssl_certificate /etc/letsencrypt/live/klanymobail.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/klanymobail.ru/privkey.pem; # managed by Certbot

    location / {
        proxy_pass http://127.0.0.1:8782;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
